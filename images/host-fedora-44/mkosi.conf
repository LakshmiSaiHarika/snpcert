[Include]
Include=../../modules/build/host

[Distribution]
Distribution=fedora
Release=44

[Content]
Packages=
    kernel
    selinux-policy-targeted,systemd
    systemd-boot-unsigned
    systemd-networkd
    systemd-resolved
    qemu
    edk2-ovmf
    dnf
    systemd-journal-remote
    net-tools
    openssh-server
    xxd
    python3
    python3-devel
    python3-pip
    python3-emoji
    jq
    avahi
    g++

# Remove kernel modules to bring Fedora 44 host image size under 800 MB
KernelModulesExclude=
	# GPU drivers
	nvidia.*
	amdgpu
	i915
	radeon
	nouveau
	drivers/gpu/
	xe
	habanalabs
	intel_vpu
	accel/ivpu

	# Bluetooth
	net/bluetooth
	drivers/bluetooth/

	# Wireless networking
	net/wireless/
	drivers/net/wireless/
	net/mac80211/
	cfg80211

	# Alternative filesystems - ext4 is sufficient
	reiserfs
	gfs2
	ocfs2
	jfs
	f2fs
	ntfs
	ntfs3
	hfs
	udf
	btrfs
	xfs
	nilfs2
	minix
	hfsplus
	ceph
	orangefs
	afs
	9p
	cifs
	nfs
	nfsd
	fuse
	overlayfs
	squashfs
	cramfs
	romfs
	erofs
	ubifs
	jffs2
	ecryptfs
	affs
	sysv
	qnx4
	qnx6
	hpfs
	omfs
	efs
	freevxfs
	exfat
	vfat
	fat
	msdos
	isofs
	ufs

